# Masaüstü sürümü (Tur 66, `apps/desktop`): Tauri kabuğu.
#
# Kabuğa ya da onun kullandığı web paketine dokunan her PR'da ve main'de:
# Rust birim testleri, sürüm derlemesi ve derlenmiş oyunun gerçek
# penceresinde uçtan uca test (Linux, WebKitGTK, tools/desktop-e2e.mjs).
#
# Elle (Actions → Masaüstü → Run workflow): üç işletim sisteminin kurulum
# paketleri (Windows: MSI ve NSIS, macOS: .app ve DMG, Linux: deb, rpm,
# AppImage) ve Steam depoları (Tur 70). macOS paketi Apple sırları depoda
# varsa imzalı ve noter onaylı (Tur 74, tools/apple-signing.sh), yoksa
# imzasız; yayın listesi docs/YAYIN.md'de, Steam'e yükleme docs/STEAM.md'de.
name: Masaüstü

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/desktop-e2e.mjs'
      - 'tools/steam-depot.mjs'
      - 'docs/steam/steampipe/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/desktop-e2e.mjs'
      - 'tools/steam-depot.mjs'
      - 'docs/steam/steampipe/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Masaüstü · Linux derleme ve uçtan uca
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: WebKitGTK, WebDriver ve sanal ekran
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Rust birim testleri
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # Steam derlemesi (Tur 70): steamworks paketiyle derleniyor, bağlanıyor, testler geçiyor.
      - name: Rust birim testleri (steam özelliğiyle)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --features steam
      - name: Sürüm derlemesi
        run: pnpm --filter @capital/desktop exec tauri build --no-bundle
      - name: tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Uçtan uca (gerçek pencere)
        env:
          SHOTS: ${{ runner.temp }}/desktop-shots
        # D-Bus oturumu: tek pencere eklentisi ikinci kopyayı onunla buluyor (Tur 70).
        run: xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- node tools/desktop-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-shots
          path: ${{ runner.temp }}/desktop-shots
          retention-days: 7

  bundles:
    name: Masaüstü paketi · ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Lig sunucusu Pages'teki oyunla aynı (Lite'ın adresi, ios-lite/App/project.yml).
      - name: Kurulum paketleri
        shell: bash
        # Apple sırları yalnız bu adımda ve yalnız macOS'ta (Codex #104): bağımlılıkların
        # kurulum betikleri, önbellek ve yükleme eylemleri onları görmüyor. Boşsa paket
        # imzasız (tools/apple-signing.sh).
        env:
          SIGN_APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          SIGN_APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          SIGN_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          SIGN_APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          SIGN_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          export VITE_LEAGUE_URL=$(sed -n 's/^ *LiteLeagueURL: *"\(.*\)"/\1/p' ios-lite/App/project.yml)
          echo "Lig sunucusu: ${VITE_LEAGUE_URL:-yok}"
          source tools/apple-signing.sh
          pnpm --filter @capital/desktop exec tauri build
      - uses: actions/upload-artifact@v5
        with:
          name: capitalforge-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/release/bundle
          retention-days: 14
      # Steam deposu (Tur 70, docs/STEAM.md): steam özelliğiyle derleme ve
      # Steamworks kütüphanesi yanında; SteamPipe bu klasörü yüklüyor. macOS
      # deposu evrensel (Apple Silicon ve Intel tek .app'te).
      - name: Steam deposu
        shell: bash
        # Apple sırları yalnız bu adımda ve yalnız macOS'ta (Codex #104): bağımlılıkların
        # kurulum betikleri, önbellek ve yükleme eylemleri onları görmüyor. Boşsa paket
        # imzasız (tools/apple-signing.sh).
        env:
          SIGN_APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          SIGN_APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          SIGN_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          SIGN_APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          SIGN_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          export VITE_LEAGUE_URL=$(sed -n 's/^ *LiteLeagueURL: *"\(.*\)"/\1/p' ios-lite/App/project.yml)
          source tools/apple-signing.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            pnpm --filter @capital/desktop exec tauri build --features steam --bundles app --target universal-apple-darwin
          else
            pnpm --filter @capital/desktop exec tauri build --features steam --no-bundle
          fi
          node tools/steam-depot.mjs "$RUNNER_TEMP/steam-depot"
          # WebView2'nin önyükleyicisi (~2 MB): kurulum betiği ilk açılıştan önce çalıştırıyor.
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p "$RUNNER_TEMP/steam-depot/_CommonRedist/WebView2"
            curl -fsSL -o "$RUNNER_TEMP/steam-depot/_CommonRedist/WebView2/MicrosoftEdgeWebview2Setup.exe" \
              "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: steam-depot-${{ matrix.name }}
          path: ${{ runner.temp }}/steam-depot
          retention-days: 14

name: Lite lig sunucusu

# Cloudflare Workers + D1. Sırlar (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# yoksa iş "atlandı" diyip yeşil bitiyor; kurulum adımları ios-lite/README.md'de.
# İlk koşu veritabanını kuruyor, şemayı uyguluyor ve Worker'ı dağıtıyor;
# sonrakiler yalnızca şemayı (IF NOT EXISTS) ve kodu güncelliyor.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/lite-league/**'
      - 'packages/lite-model/src/**'
      - '.github/workflows/lite-league.yml'

permissions:
  contents: read

concurrency:
  group: lite-league
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare'a dağıt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: capitalforge-lite-league
    steps:
      - name: Sırlar
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare sırları yok; lig sunucusu dağıtılmadı (bkz. ios-lite/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - name: D1 veritabanı ve şema
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/lite-league
        run: |
          set -euo pipefail
          find_id() {
            npx --yes wrangler@4 d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const db = JSON.parse(s).find((x) => x.name === process.env.DB_NAME);
                console.log(db ? db.uuid || db.database_id || "" : "");
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create "$DB_NAME"
            ID=$(find_id)
          fi
          echo "D1: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file schema.sql
      - name: Worker'ı dağıt
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/lite-league
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee deploy.log
          URL=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1 || true)
          echo "::notice::Lig sunucusu: ${URL:-adres bulunamadı (wrangler çıktısına bak)}"
          if [ -n "$URL" ]; then curl -fsS "$URL/v1/health"; fi

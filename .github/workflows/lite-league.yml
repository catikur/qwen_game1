name: Lite lig sunucusu

# Cloudflare Workers + D1. Sırlar (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# yoksa iş "atlandı" diyip yeşil bitiyor; kurulum adımları ios-lite/README.md'de.
# Sırlar olsa da main'e birleşme kendiliğinden dağıtmıyor (Tur 51, Codex #80):
# elle başlatılan koşu ya da depo değişkeni LITE_LEAGUE_AUTODEPLOY=true.
# İlk koşu veritabanını kuruyor, şemayı uyguluyor ve Worker'ı dağıtıyor;
# sonrakiler yalnızca şemayı (IF NOT EXISTS) ve kodu güncelliyor.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/lite-league/**'
      - 'packages/lite-model/src/**'
      # Tur 51: sunucu ana oyunun koşu kodunu oyunun kendi çözücüsüyle açıyor;
      # çözücü çekirdeği ve içeriği (CEO'lar, binalar) de pakete getiriyor.
      # Pakete giren her dosyanın burada olduğunu `test/deploy.test.ts` denetliyor.
      - 'packages/core/src/**'
      - 'packages/content/src/**'
      - 'ios-lite/App/project.yml'
      - '.github/workflows/lite-league.yml'
  pull_request:
    paths:
      - 'packages/lite-league/**'
      - 'packages/lite-model/src/**'
      - 'ios-lite/App/project.yml'
      - '.github/workflows/lite-league.yml'

permissions:
  contents: read

concurrency:
  group: lite-league
  cancel-in-progress: false

jobs:
  # Uygulamanın bağlandığı canlı sunucu (project.yml → LiteLeagueURL) ayakta mı,
  # veritabanı bağlı mı: hesap aç, ligi oku. Sır gerekmiyor.
  smoke:
    name: Canlı sunucu denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Sağlık, kayıt, lig
        run: |
          set -euo pipefail
          URL=$(sed -n 's/^ *LiteLeagueURL: *"\(.*\)"/\1/p' ios-lite/App/project.yml)
          if [ -z "$URL" ]; then echo "::notice::LiteLeagueURL boş; denetim atlandı."; exit 0; fi
          echo "Sunucu: $URL"
          curl -fsS "$URL/v1/health"; echo
          ACCOUNT=$(curl -fsS -X POST -H 'content-type: application/json' -d '{"name":"CI Denetim"}' "$URL/v1/players")
          AUTH=$(echo "$ACCOUNT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(`Bearer ${a.id}.${a.token}`)})')
          LEAGUE=$(curl -fsS -H "authorization: $AUTH" "$URL/v1/league")
          echo "$LEAGUE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);if(!l.week||l.divisionKey!=="bronze")process.exit(1);console.log("lig:",l.week,l.divisionKey)})'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/league")" = 401
          # App Attest: challenge veriliyor, onaysız puan gönderimi reddediliyor.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "authorization: $AUTH" -H 'content-type: application/json' -d '{}' "$URL/v1/attest/challenge")
          if [ "$CODE" = 404 ]; then
            echo "::warning::Canlı sunucu eski sürüm (App Attest yok); yeni paketi yapıştır: pnpm lite:league-bundle (ios-lite/README.md)."
          else
            test "$CODE" = 200
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "authorization: $AUTH" -H 'content-type: application/json' -d '{"week":"x"}' "$URL/v1/reports")" = 403
          fi
          # Denetim hesabı kendini siliyor (uygulamadaki "Hesabı sil" ile aynı uç).
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "authorization: $AUTH" "$URL/v1/players/me")
          if [ "$CODE" = 404 ]; then
            echo "::warning::Canlı sunucu eski sürüm (hesap silme yok); yeni paketi yapıştır: pnpm lite:league-bundle (ios-lite/README.md)."
          else
            test "$CODE" = 200
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: $AUTH" "$URL/v1/league")" = 401
          fi
          # L10: web hesabı (adsız, oyun sunucuda), bir gönderim, silme.
          WEB=$(curl -s -X POST -H 'content-type: application/json' -H 'origin: https://catikur.github.io' -d '{"platform":"web"}' -D web.headers "$URL/v1/players")
          if echo "$WEB" | grep -q '"save"'; then
            grep -qi '^access-control-allow-origin: https://catikur.github.io' web.headers
            WAUTH=$(echo "$WEB" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(`Bearer ${a.id}.${a.token}`)})')
            sleep 3
            SYNC=$(curl -fsS -X POST -H "authorization: $WAUTH" -H 'content-type: application/json' -d '{"base":0,"batch":"ci-smoke-0001","ops":[["t",2]],"rest":0}' "$URL/v1/sync")
            echo "$SYNC" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.version!==1||r.state.clock!==2)process.exit(1);console.log("eşitleme: sürüm",r.version,"saat",r.state.clock)})'
            test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "authorization: $WAUTH" "$URL/v1/players/me")" = 200
          else
            echo "::warning::Canlı sunucu eski sürüm (web hesabı yok); yeni paketi yapıştır ve şemayı uygula (ios-lite/README.md)."
          fi
          # Tur 51: ana oyunun Tohum Ligi. Yalnız okuyor (hesap açmıyor, koşu göndermiyor).
          if curl -fsS "$URL/v1/health" | grep -q '"seed":1'; then
            WEEK=$(curl -fsS "$URL/v1/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).week))')
            SEED=$(curl -fsS -H 'origin: https://catikur.github.io' -D seed.headers "$URL/v1/seed/weeks/$WEEK")
            grep -qi '^access-control-allow-origin: https://catikur.github.io' seed.headers
            echo "$SEED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s);if(!Array.isArray(t.entries))process.exit(1);console.log("Tohum Ligi:",t.week,t.total,"koşu")})'
            # Tur 52: sunucu koşuyu gönderimde yeniden oynatıyor (Workers Paid).
            if ! curl -fsS "$URL/v1/health" | grep -q '"verify":1'; then
              echo "::warning::Canlı sunucu Tur 51 sürümünde: koşuyu sunucu doğrulamıyor. Workers Paid'i aç, yeni paketi yapıştır (ios-lite/README.md, Tur 51–52)."
            fi
          else
            echo "::warning::Canlı sunucu eski sürüm (ana oyunun Tohum Ligi yok); yeni paketi yapıştır ve şemayı uygula (ios-lite/README.md). O zamana kadar oyun yerel tabloyla açılıyor."
          fi
          echo "Canlı sunucu ve veritabanı çalışıyor."

  deploy:
    name: Cloudflare'a dağıt
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: capitalforge-lite-league
    steps:
      # Canlıya geçiş kullanıcının kararı (Codex #80): Tur 51'in sunucusu Tur 52
      # birleşince, Tur 52'ninki de Workers Paid açıldıktan sonra (tekrar CPU'su
      # ücretsiz katmanın sınırını aşıyor). Bu yüzden main'e birleşmek kendiliğinden
      # dağıtmıyor: elle (Actions → Run workflow) ya da depo değişkeni
      # LITE_LEAGUE_AUTODEPLOY=true ile.
      - name: Sırlar ve dağıtım kapısı
        id: secrets
        env:
          AUTODEPLOY: ${{ vars.LITE_LEAGUE_AUTODEPLOY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare sırları yok; lig sunucusu dağıtılmadı (bkz. ios-lite/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$AUTODEPLOY" != "true" ]; then
            echo "::notice::Otomatik dağıtım kapalı; canlıya geçiş elle: Actions → Lite lig sunucusu → Run workflow (ya da LITE_LEAGUE_AUTODEPLOY=true, ios-lite/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - name: D1 veritabanı ve şema
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/lite-league
        run: |
          set -euo pipefail
          find_id() {
            npx --yes wrangler@4 d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const db = JSON.parse(s).find((x) => x.name === process.env.DB_NAME);
                console.log(db ? db.uuid || db.database_id || "" : "");
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create "$DB_NAME"
            ID=$(find_id)
          fi
          echo "D1: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file schema.sql
      - name: Worker'ı dağıt
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/lite-league
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee deploy.log
          URL=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1 || true)
          echo "::notice::Lig sunucusu: ${URL:-adres bulunamadı (wrangler çıktısına bak)}"
          if [ -n "$URL" ]; then curl -fsS "$URL/v1/health"; fi

# Her PR'da ve main'e her girişte: tipler, birim testleri, denge, paket ve
# tarayıcıda oynanabilirlik. PR'da duman koşusu (~2 dk), main'de tam koşu.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tip · test · denge · paket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tip denetimi
        run: pnpm typecheck
      - name: Birim testleri
        run: pnpm test
      - name: Denge simülasyonu
        run: pnpm balance
      - name: Paket
        run: pnpm build
      - name: Paket bütçesi
        run: node tools/bundle-check.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  playtest:
    name: Tarayıcıda oynanış
    needs: check
    runs-on: ubuntu-latest
    # Tam koşu Tur 50'de 27 dk; sonra her tur bölüm ekledi. Tur 68'den beri
    # 45 dk'yı aşıp iptal oluyordu: main'de son bölümler hiç koşmuyordu
    # (iptal edilen koşu kırmızı değil gri görünüyor). PR'da duman koşusu.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # Tur 51: tarayıcı testi yerel lig sunucusunu açıyor (TypeScript,
      # esbuild'le derleniyor); bağımlılıklar gerekiyor.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
      - name: Playwright ve Chromium
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> "$GITHUB_ENV"
      - name: Oynanış testi
        env:
          SHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$SHOTS"
          node tools/playtest.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playtest-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  lite-web:
    name: Lite web · uçtan uca ve kareler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright ve Chromium
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> "$GITHUB_ENV"
      # Yerel lig sunucusu (bellekte SQLite) + web sürümü: hesap, eşitleme,
      # lig, cihaz taşıma, hile; ardından senaryo kareleri.
      - name: Uçtan uca test
        env:
          SHOTS: ${{ runner.temp }}/lite-web-shots
        run: node tools/lite-web-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lite-web-shots
          path: ${{ runner.temp }}/lite-web-shots
          retention-days: 14


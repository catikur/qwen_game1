# CapitalForge Lite (iOS): Swift modeli macOS'ta derleniyor ve test ediliyor.
#
# Denge TypeScript modelinde (packages/lite-model) ayarlanıyor; Swift modeli
# aynı formüllerin çevirisi. Eşitlik testleri TS'in ürettiği altın değerleri
# (ios-lite/Kit/Tests/.../Fixtures/scenarios.json) Swift'te yeniden üretiyor.
# Depo herkese açık olduğu için macOS koşucusu ücretsiz.
name: iOS Lite

on:
  pull_request:
    paths:
      - 'ios-lite/**'
      - 'packages/lite-model/**'
      - '.github/workflows/ios-lite.yml'
  push:
    branches: [main]
    paths:
      - 'ios-lite/**'
      - 'packages/lite-model/**'
      - '.github/workflows/ios-lite.yml'
  workflow_dispatch:

concurrency:
  group: ios-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    name: Swift modeli · eşitlik testleri
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Araç sürümleri
        run: swift --version && xcodebuild -version
      - name: Swift testleri
        working-directory: ios-lite/Kit
        run: swift test

  app:
    name: Uygulama · simülatör kareleri
    needs: kit
    runs-on: macos-15
    timeout-minutes: 45
    # Kareler ayrı bir dala (ios-lite-shots) yazılıyor: inceleme için.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: XcodeGen
        run: brew install xcodegen
      - name: Proje
        working-directory: ios-lite/App
        run: xcodegen generate
      # Release: senaryo botu açılışta saatlerce oyunu oynuyor; iyileştirilmiş kodla saniyeler.
      - name: Derleme (simülatör)
        working-directory: ios-lite/App
        run: |
          set -o pipefail
          xcodebuild -project CapitalForgeLite.xcodeproj -scheme CapitalForgeLite \
            -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Simülatör kareleri
        run: ios-lite/App/ci/screenshots.sh ios-lite/App/build/Build/Products/Release-iphonesimulator/CapitalForgeLite.app shots
      - uses: actions/upload-artifact@v5
        with:
          name: ios-lite-shots
          path: shots
          retention-days: 7
      - name: Kareleri ios-lite-shots dalına yaz
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd shots
          git init -q -b ios-lite-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'CapitalForge Lite simülatör kareleri — %s\n' "$SHA" > README.md
          git add -A
          git commit -q -m "Simülatör kareleri: $SHA"
          # main ve PR koşuları aynı anda yazabiliyor ("cannot lock ref"): birkaç kez dene.
          for attempt in 1 2 3 4 5; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ios-lite-shots && exit 0
            echo "itme reddedildi (deneme $attempt), yeniden denenecek"
            sleep $((attempt * 15))
          done
          exit 1


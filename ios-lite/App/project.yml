# CapitalForge Lite — iOS uygulaması (XcodeGen).
# Mac'te: brew install xcodegen && xcodegen && open CapitalForgeLite.xcodeproj
name: CapitalForgeLite
options:
  bundleIdPrefix: com.catikur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CapitalForgeLiteKit:
    path: ../Kit
targets:
  CapitalForgeLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Simge (tools/make-icon.mjs) ve yazı tipleri (Fonts/, OFL).
      - path: Resources
    dependencies:
      - package: CapitalForgeLiteKit
        product: CapitalForgeLiteKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: CapitalForge Lite
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr
        # L5: Fredoka (başlık, sayı) ve Nunito (metin), OFL; Resources/Fonts.
        UIAppFonts:
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catikur.capitalforgelite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  CapitalForgeLite:
    build:
      targets:
        CapitalForgeLite: all
    run:
      config: Debug

# CapitalForge Lite — iOS uygulaması (XcodeGen).
# Mac'te: brew install xcodegen && xcodegen && open CapitalForgeLite.xcodeproj
name: CapitalForgeLite
options:
  bundleIdPrefix: com.catikur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CapitalForgeLiteKit:
    path: ../Kit
targets:
  CapitalForgeLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Simge (tools/make-icon.mjs) ve yazı tipleri (Fonts/, OFL).
      - path: Resources
    dependencies:
      - package: CapitalForgeLiteKit
        product: CapitalForgeLiteKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: CapitalForge Lite
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        # Yalnızca HTTPS (muaf şifreleme): App Store her yüklemede sormasın.
        ITSAppUsesNonExemptEncryption: false
        # L8: lig sunucusunun adresi (Cloudflare Worker). Boşken lig "yakında"
        # kalıyor; ilk dağıtımdan sonra buraya yazılıyor (ios-lite/README.md).
        LiteLeagueURL: "https://capitalforge-lite-league.catikur.workers.dev"
        # L8: Game Center genel tablosu (cf.lite.stars, App Store Connect).
        # Yetki aşağıda, entitlements altında.
        LiteGameCenter: true
        # L6: iPad'de Split View ve Stage Manager için tam ekran zorunlu değil.
        UIRequiresFullScreen: false
        # iPhone dikey; iPad dört yön.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr
        # L5: Fredoka (başlık, sayı) ve Nunito (metin), OFL; Resources/Fonts.
        UIAppFonts:
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
    # L8: Game Center yetkisi (genel tablo).
    entitlements:
      path: Generated/CapitalForgeLite.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catikur.capitalforgelite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone ve iPad (L6).
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Apple Developer ekibi (gizli değil; her imzalı uygulamada görünüyor).
        DEVELOPMENT_TEAM: 77J92PA5Q9
        ENABLE_PREVIEWS: YES
schemes:
  CapitalForgeLite:
    build:
      targets:
        CapitalForgeLite: all
    run:
      config: Debug

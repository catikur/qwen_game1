[package]
name = "capitalforge"
version = "1.5.0"
description = "CapitalForge: şehir ve şirket kurma oyunu, masaüstü sürümü"
authors = ["Conforcus <info@conforcus.com>"]
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Steam başarımları (Tur 70): yalnız `--features steam` derlemesinde.
steamworks = { version = "=0.13.1", optional = true }

[features]
steam = ["dep:steamworks"]

[profile.release]
codegen-units = 1
lto = true
strip = true
